<!DOCTYPE html>
<html>
  <head>
    <title>VR View - gallery example</title>
    <meta name=viewport content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
    <link href="../../css/style.css" rel="stylesheet" type="text/css">
    <style>
      ul.carousel {
        display: flex;
        width: 720px;
        margin: 20px auto;
        padding: 0;
        justify-content: center;
        overflow: auto;
      }

      /* MOBILE */
      @media screen and (max-width: 700px) {
        ul.carousel {
          width: 100%;
          justify-content: flex-start;
        }

          ul.carousel li:first-child {
            padding-left: 0;
          }

          ul.carousel li:last-child {
            padding-right: 0;
          }
      }

        ul.carousel li {
          list-style: none;
          margin: 0;
          padding: 0 10px;
          display: inline-block;
        }
          ul.carousel li a {
            display: inline-block;
            text-align: center;
            margin: 0;
            padding: 0;
            color: #999;
            text-decoration: none;
          }
            ul.carousel li a.current {
              color: blue;
              text-decoration: underline;
            }
            ul.carousel li a img {
              width: 124px;
              height: 80px;
            }
            ul.carousel li a small {
              display: block;
            }
    </style>
  </head>
  <body>

    <div id="vrview"></div>

    <ul class="carousel">
      <li>
        <a href="#petra">
          <img src="images/petra-thumbnail.jpg">
          <small>Petra</small>
        </a>
      </li>
      <li>
        <a href="#christTheRedeemer">
          <img src="images/christ-redeemer-thumbnail.jpg">
          <small>Christ the Redeemer</small>
        </a>
      </li>
      <li>
        <a href="#machuPicchu">
          <img src="images/machu-picchu-thumbnail.jpg">
          <small>Machu Picchu</small>
        </a>
      </li>
      <li>
        <a href="#chichenItza">
          <img src="images/chichen-itza-thumbnail.jpg">
          <small>Chichen Itza</small>
        </a>
      </li>
      <li>
        <a href="#tajMahal">
          <img src="images/taj-mahal-thumbnail.jpg">
          <small>Taj Mahal</small>
        </a>
      </li>
    </ul>

  

    
  </body>
  <script src="../../lib/vrview.js"></script>
    <script src="vrControls.js"></script>
</html>
